server {
    listen 80;
    listen [::]:80;
    server_name onenotequeue.erinskidds.com;

    # Certbot's HTTP-01 challenge is served before this redirects all other
    # traffic to HTTPS.
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name onenotequeue.erinskidds.com;

    client_max_body_size 25m;
    ssl_certificate /etc/letsencrypt/live/onenotequeue.erinskidds.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/onenotequeue.erinskidds.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    location / {
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
}
